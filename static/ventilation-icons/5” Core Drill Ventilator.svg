             Q209 64 214 81
             L246 198
             Q249 208 239 212
             L198 223
             L183 235
             Q178 239 170 237
             L71 222
             Q62 220 58 211
             L43 55
             Q41 28 62 10Z"
          fill="url(#hoodFace)"/>
    <path d="M24 13Q38 7 53 9Q64 10 69 24L87 194Q89 209 101 222L69 218Q59 216 57 205L42 52Q40 27 24 13Z"
          fill="#c7c9c8" opacity=".58"/>
    <path d="M24 13Q39 7 54 9Q64 10 70 23" fill="none" stroke="#f0f1f0" stroke-width="1.5" opacity=".8"/>
    <path d="M69 24 87 194Q89 209 101 222" fill="none" stroke="#c1c3c2" stroke-width="1" opacity=".65"/>
    <path d="M77 14 190 58Q207 65 212 82" fill="none" stroke="#f0f1f0" stroke-width="1.5" opacity=".72"/>
    <path d="M8 16 24 13 29 217 13 222 8 211Z"
          fill="#c8cac9" stroke="#b7b9b8" stroke-width="1"/>
    <path d="m8 34 21-4 1 27-21 4Z" fill="#d7d9d8" stroke="#9fa2a1" stroke-width=".9"/>
    <path d="m10 139 21-4 1 27-21 4Z" fill="#d7d9d8" stroke="#9fa2a1" stroke-width=".9"/>
    <path d="m8 35 5-1 1 25-5 1Zm2 106 5-1 1 25-5 1Z" fill="none" stroke="#a9acab" stroke-width=".7"/>
    <path d="m18 197 156-27q8-1 15 2l55 23q6 3 0 5l-108 32q-6 2-12 0L23 214q-8-2-7-9Z"
          fill="#c6c8c7" stroke="#aeb1b0" stroke-width="1"/>
    <path d="m23 198 151-25q7-1 13 2l51 21q4 2 0 4l-103 29q-5 1-10-1L25 211q-5-2-2-7Z"
          fill="url(#grilleFace)" stroke="#a4a7a6" stroke-width=".65"/>
    <g clip-path="url(#grilleOpening)" fill="none">
      <g stroke="#d9dbda" stroke-width="1.1" stroke-linecap="round">
        <path d="m23 198 151-25"/>
        <path d="m39 202 144-25"/>
        <path d="m55 207 138-26"/>
        <path d="m71 211 131-26"/>
        <path d="m87 215 124-26"/>
        <path d="m103 220 117-27"/>
        <path d="m119 224 111-28"/>
        <path d="m137 229 103-28"/>
      </g>
      <g stroke="#555958" stroke-width=".7" opacity=".66">
        <path d="m23 198 114 31"/>
        <path d="m38 195 105 31"/>
        <path d="m53 193 101 30"/>
        <path d="m68 190 97 31"/>
        <path d="m83 188 93 30"/>
        <path d="m98 185 89 30"/>
        <path d="m113 183 84 29"/>
        <path d="m128 180 80 29"/>
        <path d="m143 178 76 29"/>
        <path d="m159 175 71 29"/>
        <path d="m174 173 67 28"/>
      </g>
    </g>
    <path d="m18 197 156-27q8-1 15 2l55 23" fill="none" stroke="#f4f5f4" stroke-width="1"/>
  </svg>
</svg>
