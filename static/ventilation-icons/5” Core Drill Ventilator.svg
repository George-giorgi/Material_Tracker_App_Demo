<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" role="img" aria-labelledby="title desc">
  <title id="title">5” Core Drill Ventilator</title>
  <desc id="desc">Three-quarter product illustration of a 5-inch core drill ventilator, with an internal square wall plate, black round duct, and folded external hood with a fitted underside grille.</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fafafa"/>
      <stop offset=".62" stop-color="#e6e7e6"/>
      <stop offset="1" stop-color="#c5c7c6"/>
    </linearGradient>
    <linearGradient id="duct" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#202324"/>
      <stop offset=".38" stop-color="#080909"/>
      <stop offset=".78" stop-color="#0d0f0f"/>
      <stop offset="1" stop-color="#272a2a"/>
    </linearGradient>
    <linearGradient id="ductEnd" x1="0" y1="0" x2="1" y2=".2">
      <stop stop-color="#090a0a"/>
      <stop offset=".7" stop-color="#111313"/>
      <stop offset="1" stop-color="#252828"/>
    </linearGradient>
  </defs>

  <path d="M0 0h500v320H0z" fill="#fff"/>

  <!-- Square internal wall plate, set behind the duct. -->
  <path d="m35 165 119 14v125l-119-18Z" fill="#c4c6c5"/>
  <path d="m37 165 115 14v122l-115-17Z" fill="url(#plate)" stroke="#a9acab" stroke-width="1.2"/>
  <path d="m43 171 103 13v108L43 277Z" fill="none" stroke="#fff" stroke-width="1.6"/>
  <path d="m49 178 91 11v95l-91-13Z" fill="none" stroke="#c3c5c4" stroke-width=".8"/>
  <g fill="#d0d2d1" stroke="#9fa2a1" stroke-width=".8">
    <path d="m43 171 9 1v10l-9-1Zm94 12 8 1v10l-8-1Zm1 91 8 1v10l-8-1Zm-96-13 9 1v10l-9-1Z"/>
  </g>
  <g fill="#575b5a">
    <circle cx="60" cy="180" r="2"/>
    <circle cx="136" cy="190" r="2"/>
    <circle cx="137" cy="278" r="2"/>
    <circle cx="60" cy="267" r="2"/>
  </g>
  <path d="m48 190-1 67m96-55 1 69" fill="none" stroke="#b8bbba" stroke-width=".9"/>

  <!-- Long cylindrical core-drill duct, seated on the plate and tucked into the hood. -->
  <path d="M91 187
           C103 176 119 169 137 161
           L252 111
           Q260 107 264 115
           L280 224
           Q282 235 270 239
           L137 279
           Q116 284 99 270
           C76 251 66 211 81 193Z"
        fill="url(#duct)" stroke="#111313" stroke-width="1.2"/>
  <path d="M83 198Q98 180 119 173L253 116" fill="none" stroke="#3a3d3d" stroke-width="1.6" opacity=".58"/>
  <path d="M81 252Q97 271 117 275L273 231" fill="none" stroke="#343737" stroke-width="1.4" opacity=".55"/>
  <ellipse cx="96" cy="230" rx="33" ry="51" transform="rotate(-18 96 230)"
           fill="url(#ductEnd)" stroke="#303333" stroke-width="1.4"/>
  <path d="M73 211Q75 195 88 184" fill="none" stroke="#4b4e4e" stroke-width="1.4" opacity=".55"/>

  <!-- The requested standalone hood is fitted over the end of the duct. -->
  <svg x="255" y="43" width="212.5" height="247" viewBox="0 0 250 260" preserveAspectRatio="none" overflow="visible">
    <defs>
      <linearGradient id="hoodSide" x1="0" y1="0" x2="1" y2=".15">
        <stop stop-color="#c9cbca"/>
        <stop offset=".48" stop-color="#d8dad9"/>
        <stop offset="1" stop-color="#e2e3e2"/>
      </linearGradient>
      <linearGradient id="hoodFace" x1=".15" y1="0" x2=".95" y2=".75">
        <stop stop-color="#d4d6d5"/>
        <stop offset=".6" stop-color="#dedfdf"/>
        <stop offset="1" stop-color="#c9cbca"/>
      </linearGradient>
      <linearGradient id="grilleFace" x1="0" y1="0" x2="0" y2="1">
        <stop stop-color="#a8abaa"/>
        <stop offset=".42" stop-color="#858988"/>
        <stop offset="1" stop-color="#666a69"/>
      </linearGradient>
      <clipPath id="grilleOpening">
        <path d="m23 198 151-25q7-1 13 2l51 21q4 2 0 4l-103 29q-5 1-10-1L25 211q-5-2-2-7Z"/>
      </clipPath>
