<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">HUMIDITY-controlled ventilation SYSTEMS</title>
  <desc id="desc">White round humidity-controlled extract valve with a deep circular rim, curved front cover, and horizontal adjustable grille.</desc>
  <defs>
    <linearGradient id="rim" x1=".12" y1=".1" x2=".92" y2=".84">
      <stop stop-color="#fff"/>
      <stop offset=".34" stop-color="#f6f7f6"/>
      <stop offset=".73" stop-color="#dfe2e2"/>
      <stop offset="1" stop-color="#b9bec0"/>
    </linearGradient>
    <linearGradient id="face" x1=".3" y1="0" x2=".62" y2="1">
      <stop stop-color="#f7f8f7"/>
      <stop offset=".55" stop-color="#e6e9e9"/>
      <stop offset="1" stop-color="#d1d5d6"/>
    </linearGradient>
    <linearGradient id="innerFace" x1=".15" y1="0" x2=".9" y2="1">
      <stop stop-color="#eef0f0"/>
      <stop offset=".48" stop-color="#dfe2e2"/>
      <stop offset="1" stop-color="#c5cbcd"/>
    </linearGradient>
    <linearGradient id="louvre" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fafbfa"/>
      <stop offset=".48" stop-color="#e0e3e3"/>
      <stop offset="1" stop-color="#b5bbbd"/>
    </linearGradient>
    <linearGradient id="darkOpening" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#9da3a5"/>
      <stop offset=".3" stop-color="#72797c"/>
      <stop offset="1" stop-color="#394145"/>
    </linearGradient>
    <linearGradient id="shutter" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f2f3f2"/>
      <stop offset=".58" stop-color="#d6d9d9"/>
      <stop offset="1" stop-color="#aeb4b6"/>
    </linearGradient>
    <filter id="shadow" x="-.18" y="-.16" width="1.36" height="1.4" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="grilleClip">
      <path d="M66 74 Q120 55 174 74 L174 165 Q120 182 66 165 Z"/>
    </clipPath>
  </defs>

  <ellipse cx="121" cy="216" rx="77" ry="12" fill="#394145" opacity=".14" filter="url(#shadow)"/>

  <!-- Deep circular mounting rim, seen slightly from above. -->
  <ellipse cx="120" cy="121" rx="104" ry="105" fill="#bcc1c2"/>
  <ellipse cx="118" cy="117" rx="103" ry="105" fill="url(#rim)" stroke="#d7dada" stroke-width="2"/>
  <ellipse cx="119" cy="116" rx="93" ry="95" fill="#e1e4e4" stroke="#fdfdfc" stroke-width="2"/>

  <!-- Broad molded face with the softly domed crown of the pictured valve. -->
  <path d="M43 69 C53 43 82 22 118 18 C154 14 185 34 197 66
           C211 102 207 167 190 195 C175 220 145 232 115 229
           C82 226 56 208 43 183 C29 156 29 104 43 69Z"
        fill="url(#face)" stroke="#d0d5d6" stroke-width="1.6"/>
  <path d="M48 66 C61 42 86 26 116 23 C149 19 177 37 190 64"
        fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/>
  <path d="M44 76 C34 107 34 155 45 181" fill="none" stroke="#fff" stroke-width="3" opacity=".72"/>

  <!-- Curved side seams on the molded outer cover. -->
  <path d="M74 44 C61 72 56 103 58 135 C59 168 67 193 82 211"
        fill="none" stroke="#c1c7c8" stroke-width="1.5"/>
  <path d="M77 45 C65 75 61 105 63 136 C64 167 71 191 85 207"
        fill="none" stroke="#fafbfa" stroke-width="1" opacity=".9"/>
  <path d="M177 46 C190 75 194 108 191 142 C190 171 181 197 166 213"
        fill="none" stroke="#c7cccd" stroke-width="1.3" opacity=".9"/>

  <!-- Recessed rounded grille well. -->
  <path d="M66 74 Q120 55 174 74 L174 165 Q120 182 66 165 Z"
        fill="url(#darkOpening)" stroke="#aab0b2" stroke-width="1.7"/>
  <path d="M70 78 Q120 62 170 78 L170 160 Q120 175 70 160 Z"
        fill="url(#innerFace)" stroke="#92999c" stroke-width="1.4"/>

  <!-- Interior adjustable damper, visible behind the grille bars. -->
  <g clip-path="url(#grilleClip)">
    <path d="M76 85 L164 82 L164 153 L76 157Z" fill="#c6cbcc"/>
    <path d="M80 91 L108 90 L108 111 L80 112Z" fill="#596165"/>
    <path d="M112 88 L160 87 L160 108 L112 109Z" fill="#d5d9d9"/>
    <path d="M80 116 L109 115 L109 139 L80 140Z" fill="#f3f4f3"/>
    <path d="M113 114 L160 112 L160 140 L113 141Z" fill="#b9bfc1"/>
    <path d="M91 145 L157 144 L157 151 L91 153Z" fill="url(#shutter)" stroke="#90979a" stroke-width="1"/>
    <path d="M111 64 L111 169" stroke="#b1b7b9" stroke-width="1" opacity=".8"/>
    <path d="M65 105 L174 103 M65 137 L174 135"
          stroke="#9fa6a8" stroke-width="1" opacity=".65"/>
  </g>

  <!-- Five broad, softly rounded horizontal louvres. -->
  <path d="M66 78 Q120 62 174 78 L174 84 Q120 68 66 84Z"
        fill="url(#louvre)" stroke="#969da0" stroke-width="1.1"/>
  <path d="M66 99 Q120 83 174 99 L174 105 Q120 89 66 105Z"
        fill="url(#louvre)" stroke="#92999c" stroke-width="1.1"/>
  <path d="M66 121 Q120 105 174 121 L174 127 Q120 111 66 127Z"
        fill="url(#louvre)" stroke="#8f9799" stroke-width="1.1"/>
  <path d="M66 143 Q120 127 174 143 L174 149 Q120 133 66 149Z"
        fill="url(#louvre)" stroke="#899194" stroke-width="1.1"/>
  <path d="M68 162 Q120 147 172 162 L172 167 Q120 153 68 167Z"
        fill="url(#louvre)" stroke="#a2a9ab" stroke-width="1"/>
  <g fill="none" stroke="#fff" stroke-width="1.2" opacity=".85">
    <path d="M70 79 Q120 65 170 79"/>
    <path d="M70 100 Q120 86 170 100"/>
    <path d="M70 122 Q120 108 170 122"/>
    <path d="M70 144 Q120 130 170 144"/>
  </g>

  <!-- Fine molded border around the insert. -->
  <path d="M66 74 Q120 55 174 74 L174 165 Q120 182 66 165Z"
        fill="none" stroke="#f7f8f7" stroke-width="1.2" opacity=".72"/>
</svg>
