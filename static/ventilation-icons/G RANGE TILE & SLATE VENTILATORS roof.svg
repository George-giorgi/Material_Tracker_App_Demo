<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" role="img" aria-labelledby="title desc">
  <title id="title">G RANGE TILE &amp; SLATE VENTILATORS roof</title>
  <desc id="desc">Isometric charcoal roof tile ventilator with a long flat flashing plate, shallow molded hood, and recessed front louvres.</desc>
  <defs>
    <linearGradient id="flashing" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#343c43"/>
      <stop offset=".55" stop-color="#242c33"/>
      <stop offset="1" stop-color="#11181e"/>
    </linearGradient>
    <linearGradient id="hoodTop" x1=".2" y1="0" x2=".8" y2="1">
      <stop stop-color="#545d65"/>
      <stop offset=".55" stop-color="#454e56"/>
      <stop offset="1" stop-color="#363f47"/>
    </linearGradient>
    <linearGradient id="hoodSide" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#414a52"/>
      <stop offset="1" stop-color="#252e36"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2=".3" y2="1">
      <stop stop-color="#39434b"/>
      <stop offset="1" stop-color="#151d24"/>
    </linearGradient>
    <linearGradient id="opening" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#080c10"/>
      <stop offset="1" stop-color="#20282e"/>
    </linearGradient>
    <filter id="shadow" x="-.2" y="-.25" width="1.5" height="1.6" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <path d="m19 151 220-129 115 59-220 132z" fill="#141b20" opacity=".18" filter="url(#shadow)"/>

  <!-- Broad, flat flashing follows the roof's long slate profile. -->
  <path d="m17 145 224-128 113 59-222 131z" fill="url(#flashing)" stroke="#141b21" stroke-width="2" stroke-linejoin="round"/>
  <path d="m17 145 115 62v5l-115-63z" fill="#12191f" stroke="#11181e" stroke-width="1"/>
  <path d="m132 207 222-131v5L132 212z" fill="#11181e" stroke="#10171d" stroke-width="1"/>
  <path d="m29 145 103 56L340 77" fill="none" stroke="#727a80" stroke-width="1.2" opacity=".54"/>
  <path d="m41 153 89 48m-77-52 90 49m187-113 11 6m-36 15 11 6" fill="none" stroke="#667078" stroke-width=".8" opacity=".4"/>
  <g fill="#11181e" stroke="#68727a" stroke-width=".65">
    <ellipse cx="288" cy="94" rx="2.4" ry="1.3" transform="rotate(-30 288 94)"/>
    <ellipse cx="309" cy="105" rx="2.4" ry="1.3" transform="rotate(-30 309 105)"/>
    <ellipse cx="268" cy="105" rx="2.4" ry="1.3" transform="rotate(-30 268 105)"/>
  </g>

  <!-- Low, swept-back outer body. -->
  <path d="m75 139 17-28 37-30 110-41 47 20 17 25-8 22-48 31-76 39-77-19z"
        fill="#141b21" opacity=".78"/>
  <path d="m82 133 16-25 34-28 106-39 41 18 14 23-8 20-45 28-75 38-71-17z"
        fill="url(#hoodSide)" stroke="#20282f" stroke-width="2" stroke-linejoin="round"/>

  <!-- Smooth low-profile crown with a broad, shallow top. -->
  <path d="m99 108 33-31 106-39 42 17-13 25-99 41-42 17z"
        fill="url(#hoodTop)" stroke="#2b343c" stroke-width="2" stroke-linejoin="round"/>
  <path d="m132 77 106-39 34 14-99 40z" fill="#727a80" opacity=".12"/>
  <path d="m104 105 27-25 13 3-27 28z" fill="#667078" opacity=".33"/>
  <path d="m132 77 106-39m-99 45 100-38" fill="none" stroke="#858d92" stroke-width="1" opacity=".4"/>

  <!-- Tapered side wall, visible on the right of the intake. -->
  <path d="m170 116 97-40 13 20-8 20-71 41-65 19 2-38z"
        fill="url(#hoodSide)" stroke="#1b232a" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="m172 121 93-38m-89 43 90-36" fill="none" stroke="#69737a" stroke-width="1" opacity=".55"/>
  <path d="m274 76 9 20-8 20-8-3 7-20z" fill="#303941" opacity=".8"/>

  <!-- Recessed front intake, facing forward and slightly left. -->
  <path d="m99 108 33 12 0 36-33-12z" fill="url(#front)" stroke="#161e25" stroke-width="2" stroke-linejoin="round"/>
  <path d="m106 117 21 8v22l-21-8z" fill="url(#opening)" stroke="#080d12" stroke-width="1.3"/>
  <path d="m110 120 3 1v20l-3-1zm5 2 3 1v20l-3-1zm5 2 3 1v20l-3-1zm5 2 2 1v19l-2-1z"
        fill="#68747b"/>
  <path d="m109 121 3 1v2l-3-1zm5 2 3 1v2l-3-1zm5 2 3 1v2l-3-1zm5 2 2 1v2l-2-1z"
        fill="#a5adb0" opacity=".8"/>

  <!-- Raised lip and narrow front drip edge. -->
  <path d="m91 137 8-29 5 2-8 29z" fill="#202830" stroke="#11181e" stroke-width="1.2"/>
  <path d="m99 144 33 12 1 7-35-13z" fill="#171f26" stroke="#0f161c" stroke-width="1.2"/>
  <path d="m94 148 42 15-1 6-43-15z" fill="#303941" stroke="#141b21" stroke-width="1.4"/>
  <path d="m96 149 38 14" fill="none" stroke="#788187" stroke-width="1" opacity=".65"/>
  <path d="m239 38 42 17" fill="none" stroke="#747d83" stroke-width="1" opacity=".55"/>
</svg>
